.card {

    background: rgba(255,255,255,0.05);
    border-radius: 20px;
    padding: 15px;

    cursor: pointer;

.card img {

    border-radius: 10px;
}

.details {
    display: none;
    font-size: 14px;
    margin-top: 10px;
}

.card.active .details {
    display: block;
}

button {
    margin-top: 10px;
    padding: 5px 10px;
    border: none;
    border-radius: 8px;
    background: cyan;
    cursor: pointer;

const container = document.getElementById("animalContainer");
const searchInput = document.getElementById("search");

function displayAnimals(filter="") {
    container.innerHTML = "";

    animals
    .filter(a => a.name.toLowerCase().includes(filter.toLowerCase()))
    .forEach(animal => {

        const card = document.createElement("div");
        card.classList.add("card");

        const audio = new Audio(animal.sound);

        card.innerHTML = `
            <img src="${animal.image}">
            <h2>${animal.name}</h2>
            <button>Play Sound 🔊</button>
            <div class="details">
                <p><b>Species:</b> ${animal.species}</p>
                <p><b>Anatomy:</b> ${animal.anatomy}</p>
                <p><b>Habits:</b> ${animal.habits}</p>
                <p><b>Explanation:</b> ${animal.explanation}</p>
                <p><b>Fact:</b> ${animal.fact}</p>
            </div>
        `;

        // toggle detail
        card.addEventListener("click", (e) => {
            if(e.target.tagName !== "BUTTON"){
                card.classList.toggle("active");
            }
        });

        // sound button
        card.querySelector("button").addEventListener("click", (e) => {
            e.stopPropagation();
            audio.currentTime = 0;
            audio.play();
        });

        container.appendChild(card);
    });
}

// search
searchInput.addEventListener("input", (e) => {
    displayAnimals(e.target.value);
});

// initial load
displayAnimals();
